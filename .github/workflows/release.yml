name: Release & Package Distribution

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Packaging Prerequisites
        run: |
          pip install --upgrade pip
          pip install build twine

      - name: Build Source Distribution & Binary Wheels
        run: |
          python -m build

      - name: Validate Package Artifacts
        run: |
          python -m twine check dist/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
            action.yml
          generate_release_notes: true
          draft: false
          prerelease: false
