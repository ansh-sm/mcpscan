[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcpscan"
version = "0.1.0"
description = "Industrial-grade security posture analyzer and vulnerability scanner for Model Context Protocol (MCP) servers."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "Ansh", email = "anshvishwa1212@gmail.com" }
]
keywords = [
    "mcp",
    "model-context-protocol",
    "security",
    "prompt-injection",
    "sarif",
    "vulnerability-scanner",
    "ai-safety"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = [
    "mcp>=1.2.0",
    "pydantic>=2.7.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "jsonschema>=4.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[project.scripts]
mcpscan = "mcpscan.cli:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
